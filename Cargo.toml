[package]
name = "cleaning-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "state_debug"
path = "src/bin/state_debug.rs"

[dependencies]
anyhow        = "1"
tempfile      = "3"
axum          = "0.7"
chrono        = { version = "0.4", features = ["serde"] }
chrono-tz     = "0.9"
hex           = "0.4"
mime          = "0.3"
rand          = "0.8"
# The directory read (src/directory.rs); the TLS stack matrix-sdk already brings.
reqwest       = { version = "0.13", default-features = false, features = ["rustls", "json"] }
sha2          = "0.10"
uuid          = { version = "1", features = ["v4", "v5"] }
mxbot-common  = { git = "https://github.com/PolynomialDivision/mxbot-common", features = ["calendar", "directory"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
tokio         = { version = "1", features = ["full"] }
toml          = "0.8"
tracing       = "0.1"

[dev-dependencies]
# A fake homeserver for the Matrix profile lookups (src/names.rs).
wiremock = "0.6"
# Requests against the website's router (src/web/tests.rs).
tower    = { version = "0.5", features = ["util"] }

# A panic anywhere ends the bot and Docker restarts it, as a supervised task
# that ends does (mxbot_common::supervise).
[profile.release]
panic = "abort"
